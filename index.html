
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUA HUB × DANZZ | FF QUIZ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>

<header>
  <div class="logo"><span>LUA</span> HUB <b>× DANZZ</b></div>
  <div class="live">● QUIZ ONLINE</div>
</header>

<main>
  <section class="panel" id="intro">
    <div class="badge">FREE FIRE CHALLENGE</div>
    <h1>FF <span>QUIZ</span></h1>
    <p class="subtitle">Uji pengetahuanmu tentang Free Fire. Berani dapat nilai sempurna?</p>

    <div class="form">
      <label>NAMA KAMU</label>
      <input id="playerName" placeholder="Masukkan nama..." maxlength="30">

      <label>GMAIL</label>
      <input id="playerEmail" type="email" placeholder="Masukkan Gmail..." maxlength="100">

      <button id="startBtn" class="primary">MULAI QUIZ ↗</button>
    </div>
    <p class="note">5 soal acak • Harus benar 5/5 untuk perfect score</p>
  </section>

  <section class="panel quiz-panel hidden" id="quiz">
    <div class="quiz-top">
      <span id="questionNumber">SOAL 1 / 5</span>
      <span id="scoreLive">0 BENAR</span>
    </div>

    <div class="progress"><div id="progressBar"></div></div>

    <h2 id="questionText">Pertanyaan</h2>
    <div id="answers" class="answers"></div>

    <button id="nextBtn" class="primary" disabled>JAWAB DULU</button>
  </section>

  <section class="panel hidden" id="result">
    <div class="badge">QUIZ SELESAI</div>
    <div class="result-icon" id="resultIcon">🏆</div>
    <h1 id="resultTitle">HASIL KAMU</h1>
    <p id="resultDesc" class="subtitle"></p>

    <div class="score-box">
      <div>
        <small>NAMA</small>
        <strong id="resultName">-</strong>
      </div>
      <div>
        <small>SKOR</small>
        <strong id="resultScore">0/5</strong>
      </div>
      <div>
        <small>NILAI</small>
        <strong id="resultValue">0</strong>
      </div>
    </div>

    <button id="sendBtn" class="primary">KIRIM HASIL KE WHATSAPP ↗</button>
    <button id="retryBtn" class="secondary">COBA LAGI</button>
  </section>
</main>

<footer>
  LUA HUB × DANZZ · FREE FIRE QUIZ
</footer>

<script>
const WHATSAPP_NUMBER = "6285784597141";

const questionBank = [
  {
    q: "Apa nama zona yang mengecil seiring berjalannya pertandingan?",
    a: ["Safe Zone", "Training Zone", "Spawn Zone", "Lobby Zone"],
    correct: 0
  },
  {
    q: "Apa tujuan utama dalam mode Battle Royale?",
    a: ["Mengumpulkan ikan", "Menjadi pemain terakhir yang bertahan", "Balapan mobil", "Membangun rumah"],
    correct: 1
  },
  {
    q: "Apa yang biasanya digunakan untuk memulihkan HP?",
    a: ["Medkit", "Gloo Wall", "Scope", "Magazine"],
    correct: 0
  },
  {
    q: "Apa fungsi Gloo Wall?",
    a: ["Menambah gold", "Mengubah karakter", "Membuat perlindungan", "Memanggil pesawat"],
    correct: 2
  },
  {
    q: "Apa sebutan untuk tempat awal sebelum pertandingan dimulai?",
    a: ["Hangar", "Lobby", "Safe Zone", "Armory"],
    correct: 1
  },
  {
    q: "Apa yang terjadi jika pemain berada di luar zona aman?",
    a: ["Mendapat bonus", "HP bisa berkurang", "Langsung menang", "Senjata otomatis upgrade"],
    correct: 1
  },
  {
    q: "Apa fungsi scope pada senjata?",
    a: ["Memperbesar tampilan target", "Memulihkan HP", "Membuat kendaraan", "Mengisi armor"],
    correct: 0
  },
  {
    q: "Dalam mode Squad, berapa pemain biasanya berada dalam satu tim?",
    a: ["2", "3", "4", "8"],
    correct: 2
  },
  {
    q: "Apa yang bisa ditemukan saat looting?",
    a: ["Senjata dan perlengkapan", "Poin ujian sekolah", "Wallpaper", "Akun email"],
    correct: 0
  },
  {
    q: "Apa fungsi revive ketika tersedia dalam mode permainan?",
    a: ["Mengganti map", "Membantu rekan kembali bertarung", "Menghapus pertandingan", "Mengganti nickname"],
    correct: 1
  }
];

let player = "";
let email = "";
let questions = [];
let current = 0;
let score = 0;
let selectedAnswer = null;

const $ = id => document.getElementById(id);

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  player = $("playerName").value.trim();
  email = $("playerEmail").value.trim();

  if (!player) {
    alert("Isi nama kamu dulu!");
    $("playerName").focus();
    return;
  }

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("Masukkan Gmail/email yang valid!");
    $("playerEmail").focus();
    return;
  }

  questions = shuffle(questionBank).slice(0, 5);
  current = 0;
  score = 0;

  $("intro").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");

  renderQuestion();
}

function renderQuestion() {
  selectedAnswer = null;
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = "PILIH JAWABAN";
  $("questionNumber").textContent = `SOAL ${current + 1} / 5`;
  $("scoreLive").textContent = `${score} BENAR`;
  $("progressBar").style.width = `${(current / 5) * 100}%`;
  $("questionText").textContent = questions[current].q;
  $("answers").innerHTML = "";

  questions[current].a.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;

    button.addEventListener("click", () => {
      document.querySelectorAll(".answer").forEach(b => b.classList.remove("selected"));
      button.classList.add("selected");
      selectedAnswer = index;
      $("nextBtn").disabled = false;
      $("nextBtn").textContent = current === 4 ? "LIHAT HASIL" : "SOAL BERIKUTNYA →";
    });

    $("answers").appendChild(button);
  });
}

function nextQuestion() {
  if (selectedAnswer === null) return;

  if (selectedAnswer === questions[current].correct) score++;

  current++;

  if (current < 5) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");

  const perfect = score === 5;
  const value = score * 20;

  $("resultIcon").textContent = perfect ? "🏆" : "🎮";
  $("resultTitle").textContent = perfect ? "PERFECT SCORE!" : "QUIZ SELESAI";
  $("resultDesc").textContent = perfect
    ? "GG! Kamu berhasil menjawab semua pertanyaan dengan benar!"
    : "Lumayan! Coba lagi untuk mendapatkan nilai sempurna 100.";
  $("resultName").textContent = player;
  $("resultScore").textContent = `${score}/5`;
  $("resultValue").textContent = `${value}/100`;
  $("progressBar").style.width = "100%";
}

function sendWhatsApp() {
  const perfect = score === 5;
  const value = score * 20;

  const message =
`🔥 LUA HUB × DANZZ — FREE FIRE QUIZ 🔥

Nama: ${player}
Skor: ${score}/5
Nilai: ${value}/100
Status: ${perfect ? "PERFECT SCORE 🏆" : "BELUM PERFECT"}

Quiz telah selesai!`;

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}

function retryQuiz() {
  $("result").classList.add("hidden");
  $("intro").classList.remove("hidden");
  $("playerName").value = player;
  $("playerEmail").value = email;
}

$("startBtn").addEventListener("click", startQuiz);
$("nextBtn").addEventListener("click", nextQuestion);
$("sendBtn").addEventListener("click", sendWhatsApp);
$("retryBtn").addEventListener("click", retryQuiz);
</script>

</body>
</html>
